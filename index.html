<style>
  /* ---------------------------------------------------------------
     Tokens pulled directly from Figma dev-mode CSS export
     (node-id 11862-9620, "Return completed" success screen).
     'Helvetica for Target' isn't installed locally, so we fall back
     to system sans-serif; everything else (sizes, colors, spacing,
     radii) matches the spec exactly.
     --------------------------------------------------------------- */
  :root {
    --font: 'Helvetica for Target', Helvetica, 'SF Pro', -apple-system,
      BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;

    --color-bg: #ffffff;
    --color-heading: #333333;
    --color-subhead: #666666;
    --color-red: #cc0000;
    --color-card-bg: #f7f7f7;
    --color-card-divider: #d6d6d6;
    --color-link: #2758b9;
    --color-yellow: #ffc957;

    /* wallet illustration palette */
    --wallet-dark: #7a440e;
    --wallet-mid: #ad6926;
    --cash-back2: #738033;
    --cash-back1: #89993d;
    --cash-front-a: #a1b347;
    --cash-front-b: #b2c74f;
    --coin-light: #e6dbd8;
    --coin-mid: #d7c9c4;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #e5e5e5;
    font-family: var(--font);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .frame {
    position: relative;
    width: 393px;
    height: 852px;
    background: var(--color-bg);
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
  }

  /* ---------------- status bar + header (native, 102px) --------- */

  .status-bar {
    position: absolute;
    left: 0;
    top: 0;
    width: 393px;
    height: 54px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    justify-content: space-between;
  }

  .status-bar .time {
    font-size: 17px;
    font-weight: 500;
    color: #000000;
  }

  .status-icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .nav-header {
    position: absolute;
    left: 0;
    top: 54px;
    width: 393px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-side {
    width: 40px;
    height: 48px;
    display: flex;
    align-items: center;
    padding: 12px 0;
  }

  .nav-side.leading {
    padding-left: 16px;
  }

  .nav-side.trailing {
    padding-right: 16px;
    justify-content: flex-end;
  }

  .icon-button {
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    width: 24px;
    height: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------------- title + subhead ------------------------------ */

  .content-heading {
    position: absolute;
    width: 353px;
    left: 20px;
    top: 110px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .content-heading h1 {
    margin: 0;
    width: 353px;
    height: 36px;
    font-size: 28px;
    font-weight: 700;
    line-height: 130%;
    text-align: center;
    color: var(--color-heading);
  }

  .content-heading p {

    width: 353px;
    height: 20px;
    font-size: 14px;
    font-weight: 400;
    line-height: 140%;
    text-align: center;

  }

  /* ---------------- illustration ---------------------------------- */

  .illustration {

    width: 360px;
    height: 360px;
    left: calc(50% - 180px + 0.5px);
    top: 158px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------------- description text ------------------------------ */

  .description {
    position: absolute;

    left: calc(50% - 156px + 0.5px);
    top: 546px;
    margin: 0;
    font-size: 14px;
    font-weight: 400;
    line-height: 140%;
    text-align: center;
    color: var(--color-heading);
  }

  /* ---------------- refund card ------------------------------------ */

  .refund-card {
    position: absolute;
    width: 353px;
    left: 20px;
    top: 617px;
  }

  .refund-card__top {
    background: var(--color-card-bg);
    border-radius: 16px 16px 0 0;
    padding: 16px;
  }

  .refund-card__row {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .refund-card__label {
    flex-grow: 1;
    font-size: 16px;
    font-weight: 700;
    line-height: 140%;
    color: var(--color-heading);
  }

  .refund-card__amount {
    font-size: 20px;
    font-weight: 700;
    line-height: 130%;
    text-align: right;
    color: var(--color-heading);
  }

  .refund-card__payment {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
  }

  .refund-card__payment span {
    font-size: 14px;
    font-weight: 400;
    line-height: 140%;
    color: var(--color-subhead);
  }

  .refund-card__bottom {
    background: var(--color-card-bg);
    border-top: 0.5px solid var(--color-card-divider);
    border-radius: 0 0 16px 16px;
    padding: 12px 20px 16px;
  }

  .link-button {
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    line-height: 140%;
    color: var(--color-link);
    cursor: pointer;
    text-align: left;
  }

  /* ---------------- wallet flap open animation ------------------------ */

  /* The TOP flap of the wallet (the dark brown back panel). In the
     source artwork it's already open/upright; here it starts folded
     shut — snapped down over the FRONT of the pocket — and flips up
     to open.

     To read as flexible material (leather/fabric) rather than one
     rigid card swinging on a door hinge, the flap is split into three
     "joints" (clipped bands of the same path) NESTED inside one
     another — each joint hinges at its OWN boundary line and inherits
     its parent's rotation, like a chain of hinges. This keeps the
     bands perfectly seamless at every frame (unlike rotating three
     independent bands around a single shared axis, which opens visible
     gaps/kinks at the joint lines). The crease straightens out
     progressively from the hinge (bottom, nearest the snap) up to the
     tip (top), in a staggered cascade.

     SVG has no true z-depth, only paint order, so the whole folding
     assembly is painted AFTER the pocket front (so while folded it
     appears in front of the pocket — it "unsnaps" from the front),
     then hides itself the instant it finishes, handing off to
     .wallet-flap-rest — the original, untouched path painted in its
     original position (behind the pocket, behind the money). At rest
     both are identical, so the handoff is invisible. */
  .wallet-flap-fold,
  .wallet-flap-rest {
    transform-origin: 173px 218px;
    transform-box: view-box;
  }

  .wallet-flap-fold {
    animation: flapHandoffOut 1ms linear 440ms forwards;
  }

  .wallet-flap-rest {
    opacity: 0;
    animation: flapHandoffIn 1ms linear 440ms forwards;
  }

  .joint-bottom {
    transform-origin: 173px 218px;
    transform-box: view-box;
    animation: jointBottom 300ms cubic-bezier(0.3, 0.8, 0.35, 1) 0ms both;
  }

  .joint-mid {
    transform-origin: 173px 186.56px;
    transform-box: view-box;
    animation: jointMid 300ms cubic-bezier(0.3, 0.8, 0.35, 1) 70ms both;
  }

  .joint-top {
    transform-origin: 173px 155.16px;
    transform-box: view-box;
    animation: jointTop 300ms cubic-bezier(0.3, 0.8, 0.35, 1) 140ms both;
  }

  /* Plain 2D rotate() rather than rotateX()/perspective(): nested 3D
     transforms don't reliably compound across nested SVG elements in
     most browsers (each level tends to flatten independently, which
     is what made the flap vanish). 2D rotation composes predictably
     through the chain and, rotating a full 180° about the shared
     bottom hinge, still reads as "folded down flat over the pocket"
     to start, since that maps the flap's span to directly overlap the
     pocket below the hinge line. */
  @keyframes jointBottom {
    0% {
      transform: rotate(180deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }

  @keyframes jointMid {
    0% {
      transform: rotate(45deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }

  @keyframes jointTop {
    0% {
      transform: rotate(25deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }

  @keyframes flapHandoffOut {
    to {
      opacity: 0;
    }
  }

  @keyframes flapHandoffIn {
    to {
      opacity: 1;
    }
  }

  /* ---------------- coin drop animation ------------------------------ */

  /* Coins/bills start invisible well above the wallet, then fall once
     the flap has opened. Each group defines --drop-end: how far past
     its original artwork position it travels, so the coins finish
     down inside the pocket rather than floating above it. These groups
     are painted BEFORE the pocket front, so it occludes them on
     arrival — they read as dropping into the pocket. */
  .coin-drop {
    opacity: 0;
    animation: coinDrop 700ms cubic-bezier(0.3, 0.75, 0.5, 1) forwards;
  }

  @keyframes coinDrop {
    0% {
      opacity: 0;
      transform: translateY(calc(var(--drop-end, 0px) - 190px));
    }
    25% {
      opacity: 1;
    }
    100% {
      opacity: 1;
      transform: translateY(var(--drop-end, 0px));
    }
  }

  /* ---------------- primary button ---------------------------------- */

  .primary-button {
    position: absolute;
    width: 353px;
    height: 48px;
    left: calc(50% - 176.5px);
    top: 784px;
    background: var(--color-red);
    border: none;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    font-size: 18px;
    font-weight: 700;
    line-height: 140%;
    color: #ffffff;
    cursor: pointer;
  }

  .primary-button:hover,
  .primary-button:active {
    background: #b10000;
  }
</style>
</head>
